[project]
name = "tender-scout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Derylian Khalfani", email = "mderylkhalfani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.0",
    "langchain-openai>=1.6.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "httpx>=0.28"
]

[project.scripts]
tender-scout = "tender_scout.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle - ruff's defaults, re-listed because select replaces them
    "F",               # pyflakes - unused imports and variables,  undefined names
    "I",               # isort - import ordering
    "C4",              # comprehension and literal style
    "BLE",             # blind except
    "DTZ",             # timezone-naive datetimes
    "RUF100",          # noqa directives that suppress nothing
]
ignore = [
    # dict(a=1) in the test helpers mirrors keyword arguments on purpose
    "C408",
    # date.today() being timezone-naive is real, but it changes behaviour
    # and belongs with the deploy ticket, not this cleanup
    "DTZ011",
]
